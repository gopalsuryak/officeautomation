{% extends "base.html" %}
{% block title %}Add Client - CA Assist{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('clients_list') }}" class="text-muted small text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i>Back to Clients
  </a>
  <h4 class="fw-bold mt-2 mb-0">Add New Client</h4>
  <p class="text-muted small mb-0">Create a client profile for compliance tracking and filings.</p>
</div>

<div class="card">
  <div class="card-body p-4">
    <form method="POST" action="{{ url_for('clients_new') }}" class="row g-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="col-md-6">
        <label class="form-label">Client Name</label>
        <input type="text" name="name" class="form-control" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Legal Name</label>
        <input type="text" name="legal_name" class="form-control" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Entity Type</label>
        <input type="text" name="entity_type" class="form-control" placeholder="pvt_ltd / individual / llp" />
      </div>
      <div class="col-md-4">
        <label class="form-label">PAN</label>
        <input type="text" name="pan" class="form-control text-uppercase" maxlength="10" />
        <div class="form-text">Format: AAAAA9999A</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">GSTIN</label>
        <input type="text" name="gstin" class="form-control text-uppercase" maxlength="15" />
        <div class="form-text">Format: 22AAAAA9999A1Z5</div>
      </div>

      <div class="col-md-4">
        <label class="form-label">CIN</label>
        <input type="text" name="cin" class="form-control" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" />
      </div>

      <div class="col-md-8">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" />
      </div>
      <div class="col-md-2">
        <label class="form-label">State Code</label>
        <input type="text" name="state_code" class="form-control text-uppercase" maxlength="2" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Assigned User ID</label>
        <input type="number" name="assigned_user_id" class="form-control" min="1" />
      </div>

      <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2 mt-3">
        <a href="{{ url_for('clients_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Client</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

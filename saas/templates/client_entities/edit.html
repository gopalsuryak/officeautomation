{% extends "base.html" %}
{% block title %}Edit Client - {{ client.name }}{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('clients_detail', client_id=client.id) }}" class="text-muted small text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i>Back to Client
  </a>
  <h4 class="fw-bold mt-2 mb-0">Edit Client</h4>
  <p class="text-muted small mb-0">Update client profile details.</p>
</div>

<div class="card mb-3">
  <div class="card-body p-4">
    {% if client.status == 'active' %}
    <div class="d-flex justify-content-end mb-3">
      <form method="POST" action="{{ url_for('clients_deactivate', client_id=client.id) }}" onsubmit="return confirm('Deactivate this client?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <button type="submit" class="btn btn-outline-danger">Deactivate Client</button>
      </form>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('clients_edit', client_id=client.id) }}" class="row g-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="col-md-6">
        <label class="form-label">Client Name</label>
        <input type="text" name="name" class="form-control" value="{{ client.name }}" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Legal Name</label>
        <input type="text" name="legal_name" class="form-control" value="{{ client.legal_name or '' }}" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Entity Type</label>
        <input type="text" name="entity_type" class="form-control" value="{{ client.entity_type or '' }}" />
      </div>
      <div class="col-md-4">
        <label class="form-label">PAN</label>
        <input type="text" name="pan" class="form-control text-uppercase" maxlength="10" value="{{ client.pan or '' }}" />
        <div class="form-text">Format: AAAAA9999A</div>
      </div>
      <div class="col-md-4">
        <label class="form-label">GSTIN</label>
        <input type="text" name="gstin" class="form-control text-uppercase" maxlength="15" value="{{ client.gstin or '' }}" />
        <div class="form-text">Format: 22AAAAA9999A1Z5</div>
      </div>

      <div class="col-md-4">
        <label class="form-label">CIN</label>
        <input type="text" name="cin" class="form-control" value="{{ client.cin or '' }}" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ client.email or '' }}" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ client.phone or '' }}" />
      </div>

      <div class="col-md-8">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" value="{{ client.address or '' }}" />
      </div>
      <div class="col-md-2">
        <label class="form-label">State Code</label>
        <input type="text" name="state_code" class="form-control text-uppercase" maxlength="2" value="{{ client.state_code or '' }}" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Assigned User ID</label>
        <input type="number" name="assigned_user_id" class="form-control" min="1" value="{{ client.assigned_user_id or '' }}" />
      </div>

      <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2 mt-3">
        <div class="d-flex gap-2">
          <a href="{{ url_for('clients_detail', client_id=client.id) }}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Client</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

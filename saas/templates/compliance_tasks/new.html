{% extends "base.html" %}
{% block title %}New Compliance Task - CA Assist{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('tasks_list') }}" class="text-muted small text-decoration-none">
    <i class="bi bi-arrow-left me-1"></i>Back to Tasks
  </a>
  <h4 class="fw-bold mt-2 mb-0">Create Compliance Task</h4>
  <p class="text-muted small mb-0">Internal DB-backed lifecycle task for your CA team.</p>
</div>

<div class="card">
  <div class="card-body p-4">
    <form method="POST" action="{{ url_for('new_task') }}" class="row g-3" id="newTaskForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="col-md-6">
        <label class="form-label">Client</label>
        <select name="client_entity_id" id="client_entity_id" class="form-select" required>
          <option value="">Select Client</option>
          {% for c in clients %}
          <option value="{{ c.id }}" data-client-name="{{ c.name }}">{{ c.name }}{% if c.gstin %} ({{ c.gstin }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Task Type</label>
        <select name="task_type" id="task_type" class="form-select" required>
          <option value="">Select Task Type</option>
          {% for key, label in task_type_labels.items() %}
          <option value="{{ key }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Title</label>
        <input type="text" name="title" id="title" class="form-control" required />
      </div>

      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
      </div>

      <div class="col-md-4">
        <label class="form-label">Period</label>
        <input type="text" name="period" id="period" class="form-control" placeholder="May 2026 / Q1 FY 2026-27" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Financial Year</label>
        <input type="text" name="financial_year" class="form-control" placeholder="2026-27" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Due Date</label>
        <input type="date" name="due_date" class="form-control" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-select">
          <option value="normal" selected>Normal</option>
          <option value="low">Low</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Assigned User ID</label>
        <input type="number" name="assigned_user_id" class="form-control" min="1" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Reviewer User ID</label>
        <input type="number" name="reviewer_user_id" class="form-control" min="1" />
      </div>

      <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2 mt-3">
        <a href="{{ url_for('tasks_list') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Task</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const taskTypeLabels = {{ task_type_labels|tojson }};
  const clientEl = document.getElementById('client_entity_id');
  const taskTypeEl = document.getElementById('task_type');
  const periodEl = document.getElementById('period');
  const titleEl = document.getElementById('title');

  function suggestTitle() {
    if (!titleEl || titleEl.value.trim()) {
      return;
    }
    const clientOption = clientEl.options[clientEl.selectedIndex];
    const clientName = clientOption ? clientOption.getAttribute('data-client-name') : '';
    const taskType = taskTypeEl.value;
    const period = periodEl.value.trim();

    if (!clientName || !taskType) {
      return;
    }

    const typeLabel = taskTypeLabels[taskType] || taskType;
    let suggested = typeLabel + ' for ' + clientName;
    if (period) {
      suggested += ' - ' + period;
    }
    titleEl.value = suggested;
  }

  clientEl.addEventListener('change', suggestTitle);
  taskTypeEl.addEventListener('change', suggestTitle);
  periodEl.addEventListener('blur', suggestTitle);
</script>
{% endblock %}
